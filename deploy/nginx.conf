# nginx für Kcalm (statische PWA). Erreichbar nur über den Cloudflare-Tunnel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    # Standard für alles ohne Hash im Namen (index.html, sw.js, registerSW.js, Manifest, bls.json, Icons):
    # Browser und Cloudflare fragen jedes Mal nach, ob es eine neue Version gibt (sonst 304).
    # So kommen Updates sicher an.
    add_header Cache-Control "no-cache" always;

    # Dateien mit Hash im Namen ändern sich nie: ein Jahr cachen. Fehlt eine, 404 statt index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx kennt .webmanifest nicht; leere types-Liste, damit default_type gilt
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Für den Health-Check im Container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Unbekannte Pfade liefern die App (Neu laden auf jeder Seite geht)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
