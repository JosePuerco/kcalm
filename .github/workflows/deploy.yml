# Baut Kcalm bei jedem Push auf main und veröffentlicht es auf Cloudflare Workers
# (https://kcalm.dunkleschokola.de/, Konfiguration in wrangler.jsonc).
# Schlagen Tag-Prüfung, Tests, Lint oder Build fehl, wird nicht deployt.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manuell im Reiter „Actions“ startbar

permissions:
  contents: read

# Immer nur ein Deploy gleichzeitig; ein laufender wird nicht abgebrochen
concurrency:
  group: deploy
  cancel-in-progress: false

# Runner fest auf Ubuntu 24.04 statt ubuntu-latest (wechselt ab 19.10.2026 schrittweise auf 26.04);
# auf eine neue Version nur bewusst umstellen und den ersten Deploy danach beobachten
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Jeder Deploy ist eine Version: Tag v<Version aus package.json> muss auf diesen Commit zeigen
      - name: Version prüfen
        run: |
          version=$(node -p "require('./package.json').version")
          if ! git fetch --depth=1 origin "refs/tags/v$version:refs/tags/v$version"; then
            echo "::error::Tag v$version fehlt. Vor dem Push Version erhöhen, CHANGELOG.md ergänzen und taggen."
            exit 1
          fi
          if [ "$(git rev-list -n 1 "v$version")" != "$GITHUB_SHA" ]; then
            echo "::error::Tag v$version zeigt nicht auf diesen Commit. Version erhöhen und neu taggen."
            exit 1
          fi
          echo "Version $version"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

      # Gebaute App an den Job deploy weitergeben
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: false

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare
      url: https://kcalm.dunkleschokola.de
    steps:
      # Nur für wrangler.jsonc
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      # Token und Konto-ID setzt Jan selbst als Repo-Secrets (gh secret set)
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.158.0
          command: deploy
