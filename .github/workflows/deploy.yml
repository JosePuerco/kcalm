# Baut Kcalm bei jedem Push auf main und veröffentlicht es auf GitHub Pages
# (https://josepuerco.github.io/kcalm/). Schlagen Tests fehl, wird nicht deployt.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manuell im Reiter „Actions“ startbar

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig; ein laufender wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Jeder Deploy ist eine Version: Tag v<Version aus package.json> muss auf diesen Commit zeigen
      - name: Version prüfen
        run: |
          version=$(node -p "require('./package.json').version")
          if ! git fetch --depth=1 origin "refs/tags/v$version:refs/tags/v$version"; then
            echo "::error::Tag v$version fehlt. Vor dem Push Version erhöhen, CHANGELOG.md ergänzen und taggen."
            exit 1
          fi
          if [ "$(git rev-list -n 1 "v$version")" != "$GITHUB_SHA" ]; then
            echo "::error::Tag v$version zeigt nicht auf diesen Commit. Version erhöhen und neu taggen."
            exit 1
          fi
          echo "Version $version"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
