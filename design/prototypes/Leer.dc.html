</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #0D0E12; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; font-feature-settings: 'tnum' 1">

<div style="padding: 50px 6px 4px 16px; display: flex; align-items: center; justify-content: space-between">
<button style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600">Fr 16.10.<span style="font-weight: 400; color: #646874">· Heute</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#646874" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>

</div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 120px; display: flex; flex-direction: column; gap: 10px">

<svg width="142" height="142" viewBox="0 0 142 142" aria-hidden="true"><circle cx="71" cy="71" r="62" fill="none" stroke="#E9EBF0" stroke-width="12"></circle></svg>

<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #646874">{{m.label}}</span><span style="font-weight: 600">0<span style="font-weight: 400; color: #646874">/{{m.goal}}</span></span></div>
<div style="height: 5px; border-radius: 3px; background: #E9EBF0"></div>
</div>
</sc-for>
</div>
</div>

<button class="kc-press" style="min-height: 46px; border-radius: 14px; background: #F3F4F6; font-size: 14px; font-weight: 600; text-align: center">Tag kopieren…</button>

<span style="font-size: 14px; font-weight: 500">Wasser</span>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #E9EBF0"></div>
<span style="font-size: 13px; color: #646874">0 / 2,5 l</span>
<button aria-label="250 ml Wasser hinzufügen" class="kc-press" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2F4BE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<sc-for list="{{slots}}" as="s" hint-placeholder-count="4">

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C5C9D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
<span style="font-size: 15px; font-weight: 600">{{s}}</span>
<span style="font-size: 13px; color: #646874">leer</span>
<a href="Kern.dc.html" aria-label="Zu {{s}} hinzufügen" class="kc-press" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2F4BE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
