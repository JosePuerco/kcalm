<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kcalm Statistik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.kc-press{transition:transform 140ms cubic-bezier(.2,.8,.2,1)}
.kc-press:active{transform:scale(.95)}
.kc-scroll>*{flex-shrink:0}
.kc-bar{transition:height 480ms cubic-bezier(.2,.8,.2,1),background 200ms ease}
@media (prefers-reduced-motion: reduce){.kc-press,.kc-bar{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #0D0E12; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; font-feature-settings: 'tnum' 1">

<div style="padding: 52px 20px 8px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.5px">Statistik</h1>
</div>
<div role="tablist" style="margin: 0 16px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E6E8EC; border-radius: 12px; padding: 3px">
<sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
<button role="tab" onClick="{{r.pick}}" style="min-height: 36px; border-radius: 9px; font-size: 13px; font-weight: 600; text-align: center; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</button>
</sc-for>
</div>

<div class="kc-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 120px; display: flex; flex-direction: column; gap: 10px">

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
<div style="background: #FFFFFF; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #646874">{{t.label}}</span>
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.5px">{{t.val}}</span>
<span style="font-size: 11px; color: #646874">{{t.sub}}</span>
</div>
</sc-for>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">kcal pro Tag</span>
<span style="font-size: 13px; color: #646874">{{sel}}</span>
</div>
<div style="position: relative; height: 150px; margin-top: 12px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: {{goalPos}}; border-top: 1.5px dashed #9A9EA8"></div>
<span aria-hidden="true" style="position: absolute; right: 0; bottom: {{goalPos}}; transform: translateY(-2px); font-size: 10px; color: #646874; background: #FFFFFF; padding-left: 4px">2.800</span>
<div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: {{gap}}">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<button onClick="{{b.pick}}" aria-label="{{b.aria}}" style="flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 0">
<span class="kc-bar" style="display: block; width: 100%; height: {{b.h}}; background: {{b.color}}; border-radius: 4px 4px 2px 2px; opacity: {{b.op}}"></span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; gap: {{gap}}; margin-top: 6px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<span style="flex: 1; text-align: center; font-size: 10px; color: #646874; min-width: 0">{{b.lab}}</span>
</sc-for>
</div>
<div style="display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: #646874">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3D5AFE"></span>vollständig</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #C9CCD3"></span>unvollständig</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; border-top: 1.5px dashed #9A9EA8"></span>Tagesziel</span>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px">
<span style="font-size: 15px; font-weight: 600">Makros · Ø pro Tag</span>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{m.label}}</span><span><span style="font-weight: 600">{{m.val}}</span><span style="color: #646874"> / {{m.goal}} · {{m.pct}}</span></span></div>
<div style="position: relative; height: 8px; border-radius: 4px; background: #E9EBF0"><div class="kc-bar" style="height: 8px; border-radius: 4px; background: #0D0E12; width: {{m.w}}"></div></div>
</div>
</sc-for>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Gewicht</span>
<a href="Schaetzung.dc.html" style="font-size: 13px; color: #2F4BE8; text-decoration: none; min-height: 32px; display: flex; align-items: center">Verbrauch 2.585 ± 150 kcal</a>
</div>
<svg viewBox="0 0 326 120" width="100%" height="120" role="img" aria-label="Gewichtstrend der letzten 28 Tage, von 74,2 auf 74,7 Kilogramm" style="display: block; margin-top: 8px">
<line x1="0" y1="20" x2="326" y2="20" stroke="#ECEDF0" stroke-width="1"></line>
<line x1="0" y1="60" x2="326" y2="60" stroke="#ECEDF0" stroke-width="1"></line>
<line x1="0" y1="100" x2="326" y2="100" stroke="#ECEDF0" stroke-width="1"></line>
<path d="{{rawPath}}" fill="none" stroke="#C9CCD3" stroke-width="5" stroke-linecap="round"></path>
<path d="{{trendPath}}" fill="none" stroke="#3D5AFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="0" y="16" font-size="10" fill="#646874">75,0</text>
<text x="0" y="96" font-size="10" fill="#646874">74,0</text>
</svg>
<div style="display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: #646874">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C9CCD3"></span>Messung</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 2px; background: #3D5AFE"></span>Trend</span>
<span style="margin-left: auto">+0,5 kg in 4 Wochen</span>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Wasser · Ø pro Tag</span>
<span style="font-size: 15px"><span style="font-weight: 600">2,1 l</span><span style="color: #646874"> / 2,5 l</span></span>
</div>
</div>

<nav style="position: absolute; left: 20px; right: 20px; bottom: 26px; height: 62px; border-radius: 31px; background: #FFFFFF; box-shadow: 0 6px 24px rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
<a href="Kern.dc.html" aria-label="Tagebuch" class="kc-press" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #646874"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></a>
<a href="Statistik.dc.html" aria-label="Statistik" aria-current="page" class="kc-press" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #0D0E12"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></a>
<a href="Kern.dc.html" aria-label="Hinzufügen" class="kc-press" style="width: 64px; height: 46px; border-radius: 23px; background: #3D5AFE; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="Lebensmittel.dc.html" aria-label="Lebensmittel" class="kc-press" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #646874"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg></a>
<a href="Einstellungen.dc.html" aria-label="Einstellungen" class="kc-press" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #646874"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var KC_K = [];
var KC_W = [];
(function () {
  for (var i = 0; i < 90; i++) {
    var v = 2800 + Math.round(Math.sin(i * 1.7) * 260 + Math.cos(i * 0.6) * 140);
    if (i % 7 === 5) v += 420;
    KC_K.push({ k: v, full: i % 11 !== 4 });
  }
  for (var j = 0; j < 28; j++) KC_W.push(74.2 + j * 0.018 + Math.sin(j * 1.3) * 0.35);
})();
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { range: 'w', sel: null }; }
  renderVals() {
    var self = this;
    var st = this.state;
    var fm = function (n, d) { return Number(n).toLocaleString('de-DE', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); };
    var n = st.range === 'w' ? 7 : (st.range === 'm' ? 28 : 13);
    var data;
    var wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    if (st.range === 'q') {
      data = [];
      for (var w = 0; w < 13; w++) {
        var s = 0; var fullAll = true;
        for (var d = 0; d < 7; d++) { s += KC_K[w * 7 + d].k; if (!KC_K[w * 7 + d].full) fullAll = false; }
        data.push({ k: s / 7, full: fullAll, lab: 'KW' + (30 + w) });
      }
    } else {
      data = KC_K.slice(90 - n).map(function (x, i) { return { k: x.k, full: x.full, lab: n === 7 ? wd[i] : ((i % 7 === 0) ? String(19 + i - 28 + 30 > 30 ? (i - 11) : 19 + i).replace(/^-?\d+$/, function () { return ''; }) : '') }; });
      if (n === 28) data.forEach(function (x, i) { x.lab = i % 7 === 0 ? (['21.9.', '28.9.', '5.10.', '12.10.'][i / 7]) : ''; });
    }
    var max = 3600;
    var total = 0; var fulls = 0;
    data.forEach(function (x) { total += x.k; if (x.full) fulls++; });
    var avg = total / data.length;
    var sel = st.sel !== null && st.sel < data.length ? data[st.sel] : null;
    var unit = st.range === 'q' ? 'Ø/Tag in der Woche' : '';
    return {
      ranges: [['w', 'Woche'], ['m', '4 Wochen'], ['q', '3 Monate']].map(function (r) { var on = st.range === r[0]; return { label: r[1], bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0D0E12' : '#646874', pick: function () { self.setState({ range: r[0], sel: null }); } }; }),
      tiles: [
        { label: 'Ø kcal/Tag', val: fm(avg), sub: 'Ziel 2.800' },
        { label: 'Vollständig', val: fulls + '/' + data.length, sub: st.range === 'q' ? 'Wochen' : 'Tage' },
        { label: 'Bilanz', val: (avg - 2800 >= 0 ? '+' : '−') + fm(Math.abs(avg - 2800)), sub: 'kcal/Tag zum Ziel' }
      ],
      sel: sel ? (sel.lab || 'Tag') + ': ' + fm(sel.k) + ' kcal' + (sel.full ? '' : ' · unvollständig') : (unit || 'Tippe auf einen Balken'),
      goalPos: (2800 / max * 100).toFixed(1) + '%',
      gap: n > 14 ? '3px' : '8px',
      bars: data.map(function (x, i) {
        var on = st.sel === i;
        return {
          h: (Math.min(x.k, max) / max * 100).toFixed(1) + '%',
          color: x.full ? '#3D5AFE' : '#C9CCD3',
          op: st.sel === null || on ? '1' : '0.45',
          lab: x.lab,
          aria: (x.lab || 'Tag ' + (i + 1)) + ', ' + fm(x.k) + ' kcal',
          pick: function () { self.setState({ sel: self.state.sel === i ? null : i }); }
        };
      }),
      macros: [
        { label: 'Eiweiß', val: '131 g', goal: '140 g', pct: '94 %', w: '94%' },
        { label: 'Kohlenhydrate', val: '318 g', goal: '330 g', pct: '96 %', w: '96%' },
        { label: 'Fett', val: '86 g', goal: '80 g', pct: '108 %', w: '100%' },
        { label: 'Ballaststoffe', val: '24 g', goal: '30 g', pct: '80 %', w: '80%' }
      ],
      rawPath: KC_W.map(function (v, i) { var x = 6 + i * (314 / 27); var y = 100 - (v - 74) * 80; return 'M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'h0'; }).join(' '),
      trendPath: (function () {
        var t = KC_W[0]; var pts = [];
        KC_W.forEach(function (v, i) { t = t + 0.15 * (v - t); var x = 6 + i * (314 / 27); var y = 100 - (t - 74) * 80; pts.push((i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)); });
        return pts.join(' ');
      })()
    };
  }
}
</script>
</body>
</html>
